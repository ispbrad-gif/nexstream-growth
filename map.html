<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Check your address · Nexstream</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
body{margin:0;font-family:Outfit,sans-serif;color:#14231b;background:#faf8f3}
header{display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #ddd}
a{color:#1f4a34;text-decoration:none;font-weight:600}
.shell{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 50px)}
.panel{padding:20px}
h1{font-family:Instrument Serif,serif;font-size:32px;font-weight:400}
input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #ccc}
button{background:#1f4a34;color:#fff;border:0;font-weight:600}
#map{min-height:420px;background:#d7e0d4}
@media(max-width:800px){.shell{grid-template-columns:1fr}}
</style></head>
<body>
<header><a href="index.html">NEXSTREAM</a><a href="tel:8309901118">830.990.1118</a></header>
<div class="shell">
<aside class="panel">
<h1>Find your road.</h1>
<p>Type an address. County color is the award, not a lit drop.</p>
<form id="f"><input id="q" placeholder="Address or city, Texas" style="width:100%;margin:12px 0"/><button>Search</button></form>
<p><a href="burleson.html">Burleson County sample</a></p>
<div id="out"></div>
</aside>
<div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([30.55,-98.75],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
let marker;
document.getElementById('f').onsubmit=async e=>{
e.preventDefault();
const q=document.getElementById('q').value.trim()+(document.getElementById('q').value.includes('Texas')?'':', Texas');
const data=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q='+encodeURIComponent(q)).then(r=>r.json());
if(!data.length){document.getElementById('out').textContent='No match';return;}
const hit=data[0];
if(marker)map.removeLayer(marker);
marker=L.marker([+hit.lat,+hit.lon]).addTo(map);
map.setView([+hit.lat,+hit.lon],11);
document.getElementById('out').textContent=hit.display_name+' — confirm against the plant file.';
};
</script>
</body></html>
