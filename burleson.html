<script>
const map=L.map('map').setView([30.52,-96.69],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
let marker;
async function go(q){
const data=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q='+encodeURIComponent(q)).then(r=>r.json());
if(!data[0])return;
const h=data[0];
if(marker)map.removeLayer(marker);
marker=L.marker([+h.lat,+h.lon]).addTo(map);
map.setView([+h.lat,+h.lon],13);
document.getElementById('out').textContent=h.display_name+' — awarded county, confirm the drop.';
}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.q));
</script>
